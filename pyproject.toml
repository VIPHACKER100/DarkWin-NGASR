[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "darkwin"
version = "2.0.0"
description = "Next-Generation Automated Security Research Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ARYAN AHIRWAR (VIPHACKER.100)" }]
license = "MIT"
dependencies = [
    "click>=8.1.7",
    "rich>=13.7.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.23",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.1",
    "celery>=5.3.6",
    "flask>=3.0.0",
    "flask-jwt-extended>=4.6.0",
    "requests>=2.31.0",
    "httpx>=0.25.2",
    "openai>=1.6.0",
    "pyyaml>=6.0.1",
    "pyjwt>=2.8.0",
    "shodan>=1.31.0",
]

[project.scripts]
darkwin = "core.darkwin:main"

[tool.setuptools.packages.find]
include = ["core*", "modules*", "pipelines*", "ai*", "automation*", "integrations*", "dashboards*"]
