version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: darkwin-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-darkwin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-darkwin_pass}
      POSTGRES_DB: ${DB_NAME:-darkwin_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darkwin -d darkwin_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: darkwin-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  darkwin-api:
    build:
      context: .
      dockerfile: dashboards/backend/Dockerfile
    container_name: darkwin-api
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-darkwin}:${DB_PASSWORD:-darkwin_pass}@postgres:5432/${DB_NAME:-darkwin_db}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-darkwin_secret_key}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./reports:/app/reports
      - ./logs:/app/logs

  darkwin-worker:
    build:
      context: .
      dockerfile: dashboards/backend/Dockerfile
    container_name: darkwin-worker
    command: celery -A core.scheduler worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-darkwin}:${DB_PASSWORD:-darkwin_pass}@postgres:5432/${DB_NAME:-darkwin_db}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app

volumes:
  postgres_data:
