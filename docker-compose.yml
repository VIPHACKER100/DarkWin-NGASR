version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: darkwin-postgres
    environment:
      POSTGRES_DB: darkwin
      POSTGRES_USER: darkwin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-darkwin_secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darkwin"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: darkwin-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  darkwin-api:
    build:
      context: .
      dockerfile: dashboards/backend/Dockerfile
    container_name: darkwin-api
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://darkwin:${POSTGRES_PASSWORD:-darkwin_secret}@postgres:5432/darkwin
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      FLASK_ENV: ${FLASK_ENV:-production}
    volumes:
      - ./wordlists:/app/wordlists:ro
      - ./payloads:/app/payloads:ro
      - ./reports:/app/reports
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  darkwin-worker:
    build:
      context: .
      dockerfile: dashboards/backend/Dockerfile
    container_name: darkwin-worker
    command: celery -A core.scheduler worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://darkwin:${POSTGRES_PASSWORD:-darkwin_secret}@postgres:5432/darkwin
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./wordlists:/app/wordlists:ro
      - ./payloads:/app/payloads:ro
      - ./reports:/app/reports
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  flower:
    image: mher/flower:2.0
    container_name: darkwin-flower
    command: celery --broker=redis://redis:6379/0 flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - redis

volumes:
  pgdata:
