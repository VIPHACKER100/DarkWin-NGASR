name: DARKWIN-NGASR CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run Diagnostics (Doctor)
      run: python core/doctor.py

  build-docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
    - name: Build Dashboard Image
      run: docker build -t darkwin-dashboard:latest ./dashboards/frontend-next
    - name: Build API Image
      run: docker build -f dashboards/backend/Dockerfile -t darkwin-api:latest .
